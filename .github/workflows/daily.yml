name: github-high-score-mail

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不发信（填 1）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: github-high-score-mail
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送日报
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          # 筛选条件：star 大于 10000，不限语言，按 star 降序
          # CREATED_DAYS 设为 0 表示不限制创建时间
          CREATED_DAYS: "0"
          MIN_STARS: "10000"
          LANGUAGE: ""
          TOPIC: ""
          TOP_N: "10"
        run: python digest.py

      - name: 提交已发送记录
        if: ${{ inputs.dry_run != '1' }}
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "chore: update sent state"
            git push
          else
            echo "没有 state.json，跳过提交"
          fi
